name: Validate Pull Request
author: kadanarpaOps
description: Validates source/target branch compatibility and version alignment before allowing the Pull Request

inputs:
  github-token:
    required: true
  destiny-ref:
    required: true
  source-ref:
    required: true
  dockerhub-username:
    required: true
  dockerhub-token:
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Checkout Destiny Branch
      uses: actions/checkout@v4
      with:
        token: ${{ inputs.github-token }}
        ref: ${{ inputs.destiny-ref }}
        fetch-depth: 0

    - name: Configure Git Identity & Remote
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        git config user.name "kadanarpaOps-Bot"
        git config user.email "bot@kadanarpa.com"
        git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
        
    - name: Determine Merge Kind
      id: kind
      shell: bash
      run: |
        DESTINY="${{ inputs.destiny-ref }}"
        SOURCE="${{ inputs.source-ref }}"
        
        if [ "$DESTINY" == "develop" ]; then
          echo "kind=develop" >> "$GITHUB_OUTPUT"
        elif [[ "$DESTINY" =~ ^release/[0-9]+\.[0-9]+$ ]]; then
          echo "kind=release" >> "$GITHUB_OUTPUT"
        else
          echo "ERROR: Unrecognized destiny branch '$DESTINY'."
          exit 1
        fi
        
        if [[ "$SOURCE" == fix-merge/* ]]; then
          echo "was-fix-merge=true" >> "$GITHUB_OUTPUT"
        else
          echo "was-fix-merge=false" >> "$GITHUB_OUTPUT"
        fi

    # ==================================================================
    # Case 1: Merge feature/* || fix-merge/* => develop
    # ==================================================================
    - name: Publish Develop Image
      if: steps.kind.outputs.kind == 'develop'
      uses: kadanarpaOps/Ops-Github-Workflows/.github/actions/dockerhub-publish@main
      with:
        dockerhub-username: ${{ inputs.dockerhub-username }}
        dockerhub-token: ${{ inputs.dockerhub-token }}
        image-tag: 'develop'

    - name: Cleanup fix-merge Branch
      if: steps.kind.outputs.kind == 'develop' && steps.kind.outputs.was-fix-merge == 'true'
      shell: bash
      run: |
        echo "Deleting resolved conflict branch '${{ inputs.source-ref }}'"
        git push origin --delete "${{ inputs.source-ref }}" || echo "Branch already gone, skipping."
        

    # ==================================================================
    # Case 2: bugfix/* => release/*
    # ==================================================================
    - name: Install POM XML Parser
      if: steps.kind.outputs.kind == 'release'
      shell: bash
      run: |
        npm install --prefix "${{ github.action_path }}" --no-save fast-xml-parser

    - name: Compute & Apply New Patch Version
      if: steps.kind.outputs.kind == 'release'
      id: patch
      shell: bash
      run: |
        CURRENT_VERSION=$(node -e "
          const fs=require('fs');
          const {XMLParser}=require('fast-xml-parser');
          console.log(new XMLParser({ignoreAttributes:false}).parse(fs.readFileSync('pom.xml','utf8')).project.version);
        " --prefix="${{ github.action_path }}")

        if [[ ! "$CURRENT_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
          echo "ERROR: Release version '$CURRENT_VERSION' must be a clean MAJOR.MINOR.PATCH (no -SNAPSHOT)."
          exit 1
        fi

        MAJOR="${BASH_REMATCH[1]}"; MINOR="${BASH_REMATCH[2]}"; PATCH="${BASH_REMATCH[3]}"
        NEW_PATCH="$((PATCH + 1))"
        NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"

        echo "Bumping $CURRENT_VERSION -> $NEW_VERSION"

        npm install --prefix "${{ github.action_path }}/../create-release" --no-save fast-xml-parser
        node "${{ github.action_path }}/../create-release/scripts/bump-versions.mjs" "./pom.xml" "$NEW_VERSION"

        git add pom.xml */pom.xml
        git commit -m "release: bump patch version to $NEW_VERSION (bugfix ${{ inputs.source-ref }})"
        git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"
        git push origin "${{ inputs.destiny-ref }}"
        git push origin "$NEW_VERSION"

        echo "new-version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

    - name: Publish Release Image
      if: steps.kind.outputs.kind == 'release'
      uses: kadanarpaOps/Ops-Github-Workflows/.github/actions/docker-publish@main
      with:
        dockerhub-username: ${{ inputs.dockerhub-username }}
        dockerhub-token: ${{ inputs.dockerhub-token }}
        image-tag: ${{ steps.patch.outputs.new-version }}

    - name: Attempt Silent Propagation to Develop
      if: steps.kind.outputs.kind == 'release'
      id: propagate
      shell: bash
      run: |
        git fetch origin develop
        git checkout develop
        git pull origin develop
        
        if git merge --no-ff --no-commit "origin/${{ inputs.destiny-ref }}"; then
          git commit -m "release: propagate ${{ inputs.destiny-ref }} (${{ steps.patch.outputs.new-version }}) into develop"
          git push origin develop
          echo "conflict=false" >> "$GITHUB_OUTPUT"
          echo "SUCCESS: Propagated cleanly, no fix-merge branch needed."
        else
          echo "conflict=true" >> "$GITHUB_OUTPUT"
          git merge --abort
          echo "Merge conflict detected. Will open a fix-merge branch."
        fi

    - name: Create fix-merge Branch & PR on Conflict
      if: steps.kind.outputs.kind == 'release' && steps.propagate.outputs.conflict == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        FIX_BRANCH="fix-merge/${{ steps.patch.outputs.new-version }}-to-develop"
        
        git checkout "${{ inputs.destiny-ref }}"
        git checkout -b "$FIX_BRANCH"
        git push origin "$FIX_BRANCH"
        
        gh pr create \
          --repo "${{ github.repository }}" \
          --base develop \
          --head "$FIX_BRANCH" \
          --title "!!! Resolve conflict: propagate ${{ inputs.destiny-ref }} (${{ steps.patch.outputs.new-version }}) into develop" \
          --body "Automatic propagation of \`${{ inputs.destiny-ref }}\` after merging \`${{ inputs.source-ref }}\` failed due to a merge conflict with \`develop\`.
  
        Please resolve the conflicts (via GitHub's web editor or locally) and merge this PR to complete the propagation. Once merged, the \`develop\` Docker image will be rebuilt automatically and this branch will be deleted."
        
        echo "SUCCESS: Opened conflict-resolution PR from '$FIX_BRANCH' to 'develop' >>>"
