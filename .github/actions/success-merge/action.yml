name: Success Merge on Protected Branches
author: kadanarpaOps
description: Default Fallback Behavior triggered by a successfully merge to Protected Branches

inputs:
  project-name:
    description: 'Name of the Project in the SonarQube Panel'
    required: true
  sonar-url:
    description: 'SonarQube Base URL to Fetch'
    required: true
  sonar-token:
    description: 'Sonar Permissions Token'
    required: true
  sonar-quality-gate-wait:
    description: 'Wait for the SonarQube Quality Gate Result before finishing the Action'
    required: false
    default: 'true'

runs:
  using: "composite"
  steps:
    - name: Checkout Application Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Java Environment
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
