name: Publish Image on Docker Hub
author: kadanarpaOps
description: Builds and pushes a Docker Image to Docker Hub under a given tag, reporting whether it was created or updated

inputs:
  dockerhub-username:
    required: true
    description: 'Docker Hub Username'
  dockerhub-token:
    required: true
    description: 'Docker Hub Access Token'
  image-tag:
    required: true
    description: 'Image Tag to Build and Push'

outputs:
  full-image:
    value: ${{ steps.summary.outputs.full-image }}
  was-updated:
    value: ${{ steps.check-tag.outputs.exists }}

runs:
  using: "composite"
  steps:
    - name: Resolve Docker Repository Name
      id: docker-repo
      shell: bash
      run: |
        REPOSITORY_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
        echo "name=$REPOSITORY_NAME" >> "$GITHUB_OUTPUT"

    - name: Check if Docker Tag Already Exists
      id: check-tag
      shell: bash
      run: |
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
          "https://hub.docker.com/v2/repositories/${{ inputs.dockerhub-username }}/${{ steps.docker-repo.outputs.name }}/tags/${{ inputs.image-tag }}")
        
        if [ "$HTTP_CODE" -eq 200 ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}

    - name: Build & Push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ inputs.dockerhub-username }}/${{ steps.docker-repo.outputs.name }}:${{ inputs.image-tag }}

    - name: Print Summary
      id: summary
      shell: bash
      run: |
        IMAGE="${{ inputs.dockerhub-username }}/${{ steps.docker-repo.outputs.name }}:${{ inputs.image-tag }}"
        echo "full-image=$IMAGE" >> "$GITHUB_OUTPUT"
        
        if [ "${{ steps.check-tag.outputs.exists }}" == "true" ]; then
          echo "Image tag already existed. Updated: $IMAGE"
        else
          echo "Image tag is new. Created: $IMAGE"
        fi
        echo "DockerHub Link: https://hub.docker.com/r/${{ inputs.dockerhub-username }}/${{ steps.docker-repo.outputs.name }}/tags?name=${{ inputs.image-tag }}"
