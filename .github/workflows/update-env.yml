name: Update Environment Properties For a Certain Branch
on:
  workflow_call:
    inputs:
      target-branch:
        required: true
        description: 'Target Branch to update the Environment Variables'
        type: string
      env-vars:
        required: true
        description: 'Variables in JSON format (e.g. {"PORT": "3000"})'
        type: string
    secrets:
      VPS_IP:
        required: true
      VPS_PRIVATE_KEY:
        required: true
      VPS_USERNAME:
        required: true

jobs:
  update-env:
    name: Update Environment Variables
    runs-on: ubuntu-latest

    steps:
      - name: Execute Update Environment Variables Action
        uses: kadanarpaOps/Ops-Github-Workflows/.github/actions/update-env@main
        with:
          target-branch: ${{ inputs.target-branch }}
          env-vars: ${{ inputs.env-vars }}
          vps-ip: ${{ secrets.VPS_IP }}
          vps-key: ${{ secrets.VPS_PRIVATE_KEY }}
          vps-username: ${{ secrets.VPS_USERNAME }}
